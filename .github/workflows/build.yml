name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: System-Abhängigkeiten installieren
      run: |
        sudo apt-get update
        # Installiert Kern-Pakete einzeln, um Exit-Code 100 zu verhindern
        sudo apt-get install -y build-essential git python3-dev zip unzip lld cmake || true
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev || true
        sudo apt-get install -y libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev || true
        sudo apt-get install -y Openjdk-17-jdk autoconf libtool pkg-config || true
        
        # Python-Werkzeuge installieren
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer virtualenv

    - name: APK mit Buildozer bauen
      run: |
        buildozer -v android debug
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: APK Datei speichern
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Quest-APK
        path: ./bin/*.apk

